<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: El Descubrimiento de América</title>
    <style>
        :root {
            --bg-dark: #0F172A; --card-bg: #1E293B; --primary: #6366F1;
            --primary-hover: #4F46E5; --text-light: #F8FAFC;
            --success: #10B981; --success-bg: rgba(16, 185, 129, 0.2);
            --error: #EF4444; --error-bg: rgba(239, 68, 68, 0.2);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark); color: var(--text-light);
            margin: 0; padding: 20px; display: flex;
            justify-content: center; align-items: center; min-height: 100vh;
        }
        .quiz-container {
            background: var(--card-bg); max-width: 800px; w-full;
            border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden; width: 100%; border: 1px solid #334155;
        }
        .header {
            background: var(--primary); padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .counter {
            background: rgba(0,0,0,0.2); padding: 5px 15px;
            border-radius: 20px; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px;
        }
        .content { padding: 30px; }
        h2.question { font-size: 1.6rem; margin-top: 0; margin-bottom: 30px; line-height: 1.4; }
        
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px;
        }
        .option-btn {
            background: #334155; color: white; border: 2px solid #475569;
            padding: 20px; border-radius: 12px; font-size: 1.1rem;
            text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .option-btn:hover:not(:disabled) {
            background: #475569; border-color: var(--primary); transform: translateY(-2px);
        }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        
        .option-btn.correct { background: #064E3B; border-color: var(--success); opacity: 1; }
        .option-btn.wrong { background: #7F1D1D; border-color: var(--error); opacity: 0.6; }
        
        .feedback {
            padding: 20px; border-radius: 12px; margin-bottom: 20px;
            font-size: 1.1rem; font-weight: 500; display: none; animation: fadeIn 0.4s;
        }
        .feedback.success { display: block; background: var(--success-bg); border-left: 5px solid var(--success); }
        .feedback.error { display: block; background: var(--error-bg); border-left: 5px solid var(--error); }
        
        .next-btn {
            width: 100%; background: #2563EB; color: white; border: none;
            padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; display: none; transition: background 0.2s;
        }
        .next-btn:hover { background: #1D4ED8; }
        
        .result-screen { text-align: center; display: none; padding: 40px 20px; }
        .result-screen h2 { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }
        .action-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .action-buttons button {
            padding: 15px 30px; font-size: 1.1rem; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; color: white;
        }
        .btn-restart { background: var(--primary); }
        .btn-close { background: #475569; }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            h2.question { font-size: 1.3rem; }
            .action-buttons { flex-direction: column; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Header -->
        <div class="header" id="quiz-header">
            <h1>🧠 Misión de Evaluación</h1>
            <div class="counter">PREGUNTA <span id="q-counter">1</span>/20</div>
        </div>

        <div class="content">
            <!-- Zona de Preguntas -->
            <div id="quiz-zone">
                <h2 class="question" id="question-text">Cargando...</h2>
                <div class="options-grid" id="options-grid"></div>
                <div id="feedback-box" class="feedback"></div>
                <button id="next-btn" class="next-btn" onclick="nextQuestion()">Continuar ➡️</button>
            </div>

            <!-- Pantalla Final -->
            <div id="result-zone" class="result-screen">
                <div style="font-size: 5rem; margin-bottom: 20px;">🏆</div>
                <h2>¡Misión Cumplida!</h2>
                <p style="font-size: 1.2rem; color: #94A3B8;">Has terminado tu entrenamiento avanzado sobre el Descubrimiento de América.</p>
                <div class="action-buttons">
                    <button class="btn-restart" onclick="location.reload()">🔄 Repetir Quiz</button>
                    <button class="btn-close" onclick="window.close()">❌ Cerrar pestaña</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "¿Por qué los europeos necesitaban encontrar una nueva ruta hacia Asia en el siglo XV?", options: ["Para vender sus caballos", "Porque el Imperio Otomano bloqueó la Ruta de la Seda al tomar Constantinopla", "Para buscar nuevas tierras de cultivo", "Para escapar de la peste negra"], answer: 1, explanation: "En 1453 los otomanos tomaron Constantinopla, bloqueando el comercio y encareciendo los productos de Asia." },
            { q: "¿Qué productos asiáticos eran sumamente valiosos para los europeos en esa época?", options: ["Pólvora y cañones", "Trigo y maíz", "Especias (clavo, pimienta), seda y piedras preciosas", "Madera y hierro"], answer: 2, explanation: "Las especias eran esenciales para conservar los alimentos y darles sabor." },
            { q: "¿Qué instrumento tecnológico, inventado en China, permitía a los marineros saber dónde estaba el norte?", options: ["El astrolabio", "La brújula", "La carabela", "El telescopio"], answer: 1, explanation: "La brújula fue clave para que los navegantes no se perdieran en el mar abierto." },
            { q: "¿Para qué servía el Astrolabio?", options: ["Medir la profundidad del mar", "Saber dónde estaba el norte", "Medir la altura de las estrellas y calcular la latitud", "Predecir las tormentas"], answer: 2, explanation: "El astrolabio permitía ubicarse midiendo la posición del sol y las estrellas." },
            { q: "¿Cuál fue el grave error matemático de Cristóbal Colón al planear su viaje?", options: ["Calculó mal la cantidad de comida", "Creyó que la Tierra era plana", "Creyó que la Tierra era un 25% más pequeña de lo que realmente es", "Olvidó llevar mapas"], answer: 2, explanation: "Al pensar que la Tierra era más pequeña, creyó que Asia estaba mucho más cerca cruzando el océano Atlántico." },
            { q: "¿A qué rey le presentó Colón primero su proyecto (y fue rechazado)?", options: ["Rey Enrique VIII de Inglaterra", "Rey Juan II de Portugal", "Rey Carlos V de España", "Rey de Francia"], answer: 1, explanation: "El Rey de Portugal lo rechazó porque sus navegantes ya estaban buscando otra ruta rodeando África." },
            { q: "¿Qué contrato firmó Colón con los Reyes Católicos (Isabel y Fernando)?", options: ["Tratado de Tordesillas", "Capitulaciones de Santa Fe", "Acuerdo de Madrid", "Pacto de Indias"], answer: 1, explanation: "En las Capitulaciones de Santa Fe se le otorgaron los títulos de Virrey, Almirante y el 10% de las riquezas." },
            { q: "¿De qué puerto y en qué fecha exacta zarpó Colón en su primer viaje?", options: ["Cádiz, 12 de octubre", "Puerto de Palos, 3 de agosto de 1492", "Sevilla, 15 de septiembre", "Barcelona, 3 de agosto"], answer: 1, explanation: "Salió del Puerto de Palos de la Frontera con las tres embarcaciones el 3 de agosto de 1492." },
            { q: "¿Qué isla pisó por primera vez Colón el 12 de octubre de 1492?", options: ["Cuba (Juana)", "Guanahaní (San Salvador)", "La Española", "Jamaica"], answer: 1, explanation: "Llegó a una isla de las Bahamas que los nativos llamaban Guanahaní." },
            { q: "¿Cuál era el objetivo principal del SEGUNDO viaje de Colón (1493)?", options: ["Descubrir el Océano Pacífico", "Llegar a la India", "La conquista y colonización, llevando 1.200 hombres y animales", "Encontrar a Américo Vespucio"], answer: 2, explanation: "Fue una misión a gran escala para asentar a los españoles, llevando semillas y ganado." },
            { q: "¿En qué viaje pisó Colón por primera vez el territorio continental (Sudamérica)?", options: ["Primer viaje", "Segundo viaje", "Tercer viaje", "Cuarto viaje"], answer: 2, explanation: "En el tercer viaje (1498) tocó las costas de Venezuela." },
            { q: "¿Qué región exploró en su Cuarto y último viaje buscando un paso hacia Asia?", options: ["Las costas de Norteamérica", "La costa de Centroamérica (Honduras a Panamá)", "El sur de Chile", "El río Amazonas"], answer: 1, explanation: "Exploró Centroamérica, buscando desesperadamente un estrecho marítimo que no existía allí." },
            { q: "¿Qué fue el Tratado de Tordesillas (1494)?", options: ["Un tratado de paz con los indígenas", "Un acuerdo para dividir las nuevas tierras descubiertas entre España y Portugal", "La rendición de Colón", "El permiso del Papa para comerciar"], answer: 1, explanation: "España y Portugal trazaron una línea imaginaria; el oeste fue para España y el este (Brasil) para Portugal." },
            { q: "¿Cuál de estos productos es originario de América y fue llevado a Europa (Intercambio Colombino)?", options: ["El caballo", "El trigo", "El cerdo", "El maíz, el tomate y la papa"], answer: 3, explanation: "América aportó cultivos fundamentales como la papa, el tomate, el cacao y el maíz al resto del mundo." },
            { q: "¿Qué animales introdujeron los europeos a América?", options: ["Llamas y alpacas", "Pavos", "Caballos, vacas y cerdos", "Perros"], answer: 2, explanation: "La ganadería bovina, porcina y equina no existía en América antes de 1492." },
            { q: "¿Qué le ocurrió a Colón al final de su tercer viaje en La Española?", options: ["Fue coronado rey de la isla", "Fue arrestado por un juez y devuelto a España encadenado", "Construyó la ciudad de La Isabela", "Murió en combate"], answer: 1, explanation: "Por las rebeliones y su mala gestión administrativa, los reyes enviaron a un juez que lo apresó." },
            { q: "¿De qué estaba convencido Cristóbal Colón el día que murió (1506)?", options: ["De que había descubierto un nuevo continente", "De que había llegado a las costas de Asia", "De que la Tierra era plana", "De que había llegado a Oceanía"], answer: 1, explanation: "Nunca supo que descubrió América; murió creyendo firmemente que estaba en las Indias." },
            { q: "¿Quién demostró mediante mapas y cartas que las tierras descubiertas eran un continente nuevo?", options: ["Marco Polo", "Américo Vespucio", "Martín Alonso Pinzón", "Rodrigo de Triana"], answer: 1, explanation: "El navegante italiano Américo Vespucio fue el primero en documentar que no se trataba de Asia." },
            { q: "¿Quién le puso el nombre de 'América' al continente en un mapa de 1507?", options: ["Los Reyes Católicos", "El Papa", "El cartógrafo alemán Martin Waldseemüller", "El propio Américo Vespucio"], answer: 2, explanation: "Waldseemüller publicó el primer mapa del mundo que incluía el nuevo continente bautizado en honor a Vespucio." },
            { q: "¿Por qué a los nativos americanos se les llamó 'indios'?", options: ["Porque vestían similar a los habitantes de la India", "Por un error de Colón, al creer que había llegado a Las Indias (Asia)", "Porque era una palabra en su idioma", "Para diferenciarlos de los europeos"], answer: 1, explanation: "El término nació exclusivamente del error geográfico original de la expedición española." }
        ];

        let currentQ = 0;

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQ];
            document.getElementById('q-counter').innerText = currentQ + 1;
            document.getElementById('question-text').innerText = q.q;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                grid.appendChild(btn);
            });

            const feedback = document.getElementById('feedback-box');
            feedback.className = "feedback";
            feedback.innerHTML = "";
            document.getElementById('next-btn').style.display = "none";
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            const q = questions[currentQ];
            const buttons = document.getElementById('options-grid').children;
            const feedback = document.getElementById('feedback-box');

            // Deshabilitar todos
            for(let btn of buttons) {
                btn.disabled = true;
            }

            if(selectedIndex === q.answer) {
                selectedBtn.classList.add('correct');
                feedback.innerHTML = "✅ <strong>¡Excelente!</strong> " + q.explanation;
                feedback.className = "feedback success";
            } else {
                selectedBtn.classList.add('wrong');
                buttons[q.answer].classList.add('correct'); // Resalta la correcta
                feedback.innerHTML = "❌ <strong>¡Cuidado!</strong> " + q.explanation;
                feedback.className = "feedback error";
            }
            
            document.getElementById('next-btn').style.display = "block";
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) {
                renderQuestion();
            } else {
                document.getElementById('quiz-zone').style.display = 'none';
                document.getElementById('quiz-header').style.display = 'none';
                document.getElementById('result-zone').style.display = 'block';
            }
        }

        // Iniciar al cargar
        window.onload = initQuiz;
    </script>
</body>
</html>
